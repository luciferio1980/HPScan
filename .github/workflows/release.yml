name: Release Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/CanonScanStudio.Tests/CanonScanStudio.Tests.csproj -c Release --nologo

      - name: Download OCR language data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tessdata | Out-Null
          foreach ($lang in @("spa", "eng")) {
            $url = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
            $out = Join-Path "tessdata" "$lang.traineddata"
            Write-Host "Downloading $lang..."
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          }

      - name: Publish self-contained Windows x64
        run: >
          dotnet publish src/CanonScanStudio.App/CanonScanStudio.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=true
          -p:DebugType=embedded
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/win-x64

      - name: Bundle portable package
        shell: pwsh
        run: |
          $publish = "artifacts/win-x64"
          New-Item -ItemType Directory -Force -Path "$publish/tessdata" | Out-Null
          Copy-Item tessdata/*.traineddata "$publish/tessdata/" -Force
          Copy-Item dist/LEEME.txt "$publish/LEEME.txt" -Force
          $portableRoot = "artifacts/CanonScanStudio"
          if (Test-Path $portableRoot) { Remove-Item $portableRoot -Recurse -Force }
          Copy-Item $publish $portableRoot -Recurse
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zip = "artifacts/CanonScanStudio-Portable-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $portableRoot -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc installer\CanonScanStudio.iss
          Copy-Item installer\Output\CanonScanStudio-Setup.exe artifacts\CanonScanStudio-Setup.exe -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CanonScanStudio-Windows
          path: |
            artifacts/CanonScanStudio-Portable-win-x64.zip
            artifacts/CanonScanStudio-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = @(
            "Paquete listo para Windows 10/11 64 bits. No hace falta instalar .NET.",
            "",
            "## Novedades 1.0.14",
            "- Temas en Configuración: Claro, Oscuro, Medianoche, Bosque, Atardecer, Océano y Lavanda.",
            "- Inclinación en Más opciones: deslizador a izquierda/derecha (0 deja la imagen como está).",
            "- Se ha quitado el selector Fuente (Platina/Flatbed), que no cambiaba nada.",
            "",
            "## 1.0.13",
            "- Guardar un documento importado ya no falla por DPI irreales (1 DPI, 3780 DPI, etc.).",
            "- Las fotos y capturas se ajustan a un tamaño de página imprimible.",
            "",
            "## 1.0.12",
            "- Tras la primera página puedes seguir usando Escanear, Importar, Eliminar, Duplicar, Organizar y Girar.",
            "- Organizar páginas: Mover izquierda / Mover derecha además de arrastrar.",
            "- Importar imagen o PDF desde el disco.",
            "- Eliminar y duplicar la página seleccionada.",
            "- Girar izquierda y girar derecha.",
            "",
            "## Dónde descargar",
            "En esta página, sección **Assets** (no uses Code → Download ZIP del repositorio):",
            "- **CanonScanStudio-Setup.exe** — instalador con acceso directo",
            "- **CanonScanStudio-Portable-win-x64.zip** — carpeta portable: descomprime y abre ``CanonScanStudio.exe``",
            "",
            "## Uso",
            "1. Enciende el Canon PIXMA TS5151.",
            "2. Pulsa **Escanear** para cada hoja.",
            "3. Doble clic en una página para recortarla.",
            "4. **Organizar** para reordenar. **Guardar** para el PDF.",
            "",
            "Si SmartScreen muestra un aviso, pulsa *Más información* → *Ejecutar de todas formas*.",
            "",
            "Esta versión no incluye controladores de Canon."
          ) -join "`n"
          $notesPath = "artifacts/release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8NoBOM
          $zip = "artifacts/CanonScanStudio-Portable-win-x64.zip"
          $setup = "artifacts/CanonScanStudio-Setup.exe"
          if (-not (Test-Path $zip) -or -not (Test-Path $setup)) {
            throw "Missing release files."
          }

          $delay = 15
          for ($i = 1; $i -le 6; $i++) {
            Write-Host "GitHub release attempt $i..."
            gh release view v1.0.14 *> $null
            $exists = $LASTEXITCODE -eq 0
            if ($exists) {
              gh release edit v1.0.14 --title "Canon Scan Studio 1.0.14" --notes-file $notesPath --latest
              if ($LASTEXITCODE -eq 0) {
                gh release upload v1.0.14 $zip $setup --clobber
              }
            } else {
              gh release create v1.0.14 $zip $setup --title "Canon Scan Studio 1.0.14" --notes-file $notesPath --latest
            }
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Published v1.0.14."
              exit 0
            }
            Write-Host "GitHub API failed (attempt $i). Waiting $delay seconds..."
            Start-Sleep -Seconds $delay
            $delay = [Math]::Min(90, $delay * 2)
          }
          throw "Could not publish GitHub release after retries."
